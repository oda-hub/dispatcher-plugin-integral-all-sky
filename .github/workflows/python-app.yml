# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]



jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v6
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.10.8"
        python-version: ${{ matrix.python-version }}

    - name: Install the project
      run: |
        uv sync --locked --dev

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 dispatcher_plugin_integral_all_sky --count --select=E9,F63,F7,F82 --show-source --statistics || echo "failed lint"
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 dispatcher_plugin_integral_all_sky --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || echo "failed second lint"

    - name: PyLint - more lint
      run: |
        uv run pylint -E dispatcher_plugin_integral_all_sky || echo 'this is fine!'

    - name: MyPy
      run: |
        uv run mypy dispatcher_plugin_integral_all_sky --ignore-missing-imports || echo 'this is fine too!'

    - name: Test with pytest
      run: |
        uv run python -m coverage run --source=dispatcher_plugin_integral_all_sky -m pytest tests -sv --full-trace --log-cli-level=DEBUG

    # I wonder how this interacts with the Github App. But this is not only for PR. Also this does not always work
    - name: Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
